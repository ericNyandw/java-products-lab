spring.application.name=java-codegen-lab
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5433/product2_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.web.resources.chain.strategy.content.enabled=false
spring.jmx.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.ssl.SslObservabilityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.endpoint.jmx.JmxEndpointAutoConfiguration
management.endpoints.web.exposure.include=health,info
